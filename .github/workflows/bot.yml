name: Run Telegram bot (no server)

# اجرای مداوم بدون سرور: هر ۵ دقیقه یک اجرای جدید صف می‌شود، اما concurrency
# با cancel-in-progress: false تضمین می‌کند فقط یک اجرا هم‌زمان در حال polling باشد.
# هر جاب تا نزدیک سقف زمانی GitHub Actions (۶ ساعت) زنده می‌ماند؛ وقتی تمام شد،
# اجرای بعدی که در صف منتظر بوده بلافاصله شروع می‌شود و بات را ادامه می‌دهد.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: powermatch-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Write Google service-account credentials
        if: ${{ secrets.GOOGLE_CREDENTIALS_JSON != '' }}
        run: echo "$GOOGLE_CREDENTIALS_JSON" > google_credentials.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Run bot (long polling)
        timeout-minutes: 345
        run: python -m app.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_BOT_USERNAME: ${{ secrets.ADMIN_BOT_USERNAME }}
          ADMIN_CHAT_IDS: ${{ secrets.ADMIN_CHAT_IDS }}
          ADMIN_USERNAMES: ${{ secrets.ADMIN_USERNAMES }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_FILE: google_credentials.json
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
