name: Keep bot awake

# بات دیگر روی GitHub Actions اجرا نمی‌شود (اجرای واقعی روی Render با webhook است)؛
# این workflow فقط هر ۱۰ دقیقه یک درخواست سبک به /health می‌زند تا سرویس رایگان Render
# به‌خاطر بی‌کاری به خواب نرود. هر اجرا چند ثانیه طول می‌کشد، پس دقیقه‌ی Actions مصرف
# معناداری ندارد.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 20 "$HEALTH_URL"
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
